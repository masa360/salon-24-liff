<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bride Innovation メニュープレビュー</title>
    <style>
      :root {
        --bg: #ffffff;
        --card: #ffffff;
        --line: #e5e5e5;
        --title: #6b1040;
        --text: #213f67;
        --muted: #5a6e84;
        --check: #2aa4ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 980px;
        margin: 24px auto;
        padding: 0 20px 40px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 56px;
        line-height: 1.05;
        letter-spacing: 0.02em;
        color: var(--title);
        font-weight: 800;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .card {
        position: relative;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px 20px 18px;
        min-height: 380px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      }
      .check {
        position: absolute;
        right: 10px;
        top: 10px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: var(--check);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 700;
      }
      .thumb {
        width: 140px;
        height: 120px;
        margin: 0 auto 20px;
        border-radius: 2px;
        background: linear-gradient(135deg, #e8e8e8, #d8d8d8);
        border: 1px solid #ddd;
      }
      .name {
        margin: 0;
        text-align: center;
        font-size: 44px;
        line-height: 1.25;
        letter-spacing: 0.01em;
        color: var(--text);
        font-weight: 700;
      }
      .meta {
        margin: 10px 0 0;
        text-align: center;
        font-size: 38px;
        font-weight: 700;
        color: #324e70;
      }
      .desc {
        margin: 10px 0 0;
        text-align: center;
        font-size: 24px;
        line-height: 1.45;
        color: var(--muted);
        font-weight: 700;
      }
      @media (max-width: 900px) {
        h1 { font-size: 38px; }
        .grid { grid-template-columns: 1fr; }
        .card { min-height: auto; }
        .name { font-size: 28px; }
        .meta { font-size: 24px; }
        .desc { font-size: 17px; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>サービスを選択します</h1>
      <div class="grid">
        <article class="card">
          <span class="check">✓</span>
          <div class="thumb"></div>
          <h2 class="name">ヘアメイクアップ</h2>
          <p class="meta">◷ 2時間</p>
          <p class="desc">価格はヘアスタイルによって<br />変動します。</p>
        </article>
        <article class="card">
          <div class="thumb"></div>
          <h2 class="name">ネイル</h2>
          <p class="meta">◷ 1時間</p>
          <p class="desc">価格は施術によって<br />変動します。</p>
        </article>
        <article class="card">
          <div class="thumb"></div>
          <h2 class="name">ブライダルエステ</h2>
          <p class="meta">◷ 2時間</p>
          <p class="desc">価格は施術によって<br />変動します。</p>
        </article>
        <article class="card">
          <div class="thumb"></div>
          <h2 class="name">フォトウェディング</h2>
          <p class="meta">◷ 6時間</p>
          <p class="desc">価格はプランによって<br />変動します。</p>
        </article>
      </div>
    </div>
  </body>
  </html>
